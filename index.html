
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rikku</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080d0b;
  color: #f3eee2;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}

header {
  padding: 25px;
  text-align: center;
  border-bottom: 1px solid #b99a55;
}

h1 {
  color: #c8aa65;
  font-size: 34px;
  letter-spacing: 5px;
  margin: 0;
}

.subtitle {
  color: #8da58e;
  margin-top: 8px;
}

#messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.message {
  max-width: 85%;
  background: #14231b;
  border: 1px solid #526c50;
  padding: 14px;
  border-radius: 12px;
  margin: 12px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  margin-left: auto;
  background: #293322;
  border-color: #b99a55;
}

#inputArea {
  display: flex;
  gap: 8px;
  padding: 15px;
  border-top: 1px solid #526c50;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #b99a55;
  background: #111914;
  color: white;
  font-size: 16px;
}

button {
  background: #b99a55;
  color: #080d0b;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-weight: bold;
}

button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <h1>RIKKU</h1>
  <div class="subtitle">Votre assistant personnel</div>
</header>

<div id="messages">
  <div class="message">
    Bonjour ! Je suis Rikku. Je suis maintenant prête à discuter avec vous.
  </div>
</div>

<div id="inputArea">
  <input id="userInput" placeholder="Écrivez votre message...">
  <button id="sendButton" onclick="sendMessage()">Envoyer</button>
</div>

<script>
const API_URL = "https://rikku-api.nepper-loic.workers.dev/";

async function sendMessage() {
  const input = document.getElementById("userInput");
  const messages = document.getElementById("messages");
  const button = document.getElementById("sendButton");

  const text = input.value.trim();
  if (!text) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;
  messages.appendChild(userMessage);

  input.value = "";
  button.disabled = true;
  button.textContent = "...";

  const loading = document.createElement("div");
  loading.className = "message";
  loading.textContent = "Rikku réfléchit...";
  messages.appendChild(loading);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();
    loading.remove();

    const reply = document.createElement("div");
    reply.className = "message";

    if (data.reply) {
      reply.textContent = data.reply;
    } else {
      reply.textContent = "Erreur : " + (data.error || "Réponse indisponible.");
    }

    messages.appendChild(reply);

  } catch (error) {
    loading.remove();

    const errorMessage = document.createElement("div");
    errorMessage.className = "message";
    errorMessage.textContent =
      "Impossible de contacter Rikku. Vérifiez votre connexion.";
    messages.appendChild(errorMessage);
  }

  messages.scrollTop = messages.scrollHeight;
  button.disabled = false;
  button.textContent = "Envoyer";
}

document.getElementById("userInput").addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});
</script>

</body>
</html>
