
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rikku.2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080d0b;
  color: #f3eee2;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}

header {
  padding: 30px 20px;
  text-align: center;
  border-bottom: 1px solid #b99a55;
}

h1 {
  color: #c8aa65;
  font-size: 36px;
  letter-spacing: 5px;
  margin: 0;
}

.subtitle {
  color: #8da58e;
  margin-top: 10px;
}

main {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.status {
  color: #8da58e;
  margin: 25px 0;
}

#messages {
  width: 100%;
  max-width: 600px;
  flex: 1;
}

.message {
  background: #14231b;
  border: 1px solid #526c50;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

#inputArea {
  width: 100%;
  max-width: 600px;
  display: flex;
  gap: 8px;
  padding: 15px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #b99a55;
  background: #111914;
  color: white;
  font-size: 16px;
}

button {
  background: #b99a55;
  color: #080d0b;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>RIKKU</h1>
  <div class="subtitle">Votre assistant personnel</div>
</header>

<main>
  <div class="status">● Système initialisé</div>

  <div id="messages">
    <div class="message">
      Bonjour. Je suis Rikku. Comment puis-je vous aider ?
    </div>
  </div>

  <div id="inputArea">
    <input id="userInput" placeholder="Écrivez votre message...">
    <button onclick="sendMessage()">Envoyer</button>
  </div>
</main>

<script>
function sendMessage() {
  const input = document.getElementById("userInput");
  const messages = document.getElementById("messages");

  if (!input.value.trim()) return;

  const message = document.createElement("div");
  message.className = "message";
  message.textContent = input.value;

  messages.appendChild(message);
  input.value = "";
}
</script>

</body>
</html>
